[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dls-correlation-tool"
version = "0.1.0"
description = "Motorsport telemetry correlation/box-plot/damper plotting toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "DLS Engineering" }]
dependencies = [
    "pandas>=1.3.0,<3.0",
    "numpy>=1.21.0,<3.0",
    "matplotlib>=3.5.0,<4.0",
    "scipy>=1.7.0,<2.0",
    "tqdm>=4.64.0,<5.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15.0.0,<22.0", "fastparquet>=2024.11.0,<2027.0"]
pptx = ["python-pptx>=0.6.23,<2.0"]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<7.0",
    "ruff>=0.6.0,<1.0",
    "pre-commit>=3.0,<5.0",
]

# Additive install-time shortcuts. `python Run_<name>.py` still works exactly
# as before — these entries just expose the same `main()` under a
# `pip install -e .`-friendly console-script name.
[project.scripts]
dls-correlation = "Run_Correlation:main"
dls-boxplots    = "Run_BoxPlots:main"
dls-dampers     = "Run_Dampers:main"
dls-ridedil     = "Run_RideDIL:main"
dls-ridereport  = "Run_RideReport:main"
dls-vibrations  = "Run_Vibrations:main"
dls-oc-checks   = "Run_OC_Checks:main"
dls-bumpstop    = "Run_Bumpstop:main"
dls-template    = "Run_Template:main"

[tool.setuptools]
py-modules = [
    "bootstrap",
    "channel_config",
    "Run_Correlation",
    "Run_BoxPlots",
    "Run_Dampers",
    "Run_RideDIL",
    "Run_RideReport",
    "Run_Vibrations",
    "Run_OC_Checks",
    "Run_Bumpstop",
    "Run_Template",
]

[tool.setuptools.packages.find]
include = ["engine*", "tools*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "Data", "build", "dist"]

# Formatter — deliberately EXCLUDES Run_*.py because those are user-editable
# configuration files whose visually-aligned columns and inline plot-definition
# layouts would be destroyed by autoformatting. Ruff `check` still lints them.
[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
exclude = ["Run_*.py"]

[tool.ruff.lint]
# Baseline rule set — E/W (pycodestyle), F (pyflakes), I (import sort),
# B (bugbear), UP (pyupgrade), SIM (simplifications).
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line-too-long — codebase uses a deliberately compressed style
    "E701",  # multiple statements on one line — same reason
    "E702",  # multiple statements on one line (semicolon)
    "E731",  # do-not-assign-lambda — used intentionally for `calc_channel`
    "E741",  # ambiguous variable name — domain code uses single-letter maths vars
    "B008",  # function call in default argument — `Path()` defaults are fine here
    "B028",  # no-explicit-stacklevel — noise for this codebase
    "SIM108", # ternary-vs-if — hurts readability of numerical branches
    "UP007",  # PEP-604 Union[A, B] -> A | B — codebase mixes intentionally
    "UP035",  # deprecated typing import — same reason

    # ── TODO: enable progressively (each requires contextual review) ─────
    # Delete the entry after auditing every callsite and either fixing it
    # or adding an inline `# noqa: <rule>` with a short justification.
    "B007",  # unused loop-control variable (10) — mostly stylistic (`_`)
    "B023",  # function uses loop variable (8) — verify no late-binding closures
    "B904",  # raise without `from` inside except (1) — chain the cause
    "B905",  # zip() without explicit strict= (29) — audit for length mismatches
    "E402",  # module-level import not at top (25) — mostly intentional late imports
    "SIM102", # collapsible if (1)
    "SIM105", # suppressible-exception -> contextlib.suppress (8) — stylistic
    "UP031",  # printf-style formatting (1)
]

[tool.ruff.lint.per-file-ignores]
"engine/__init__.py"    = ["F401"]  # re-exports
"engine/plot_runtime.py" = ["F401"]  # re-exports of plot dataclasses
"tests/*"               = ["B011", "B015", "B018"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=engine",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
filterwarnings = [
    "error::DeprecationWarning:engine.*",
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::DeprecationWarning:pandas.*",
]

[tool.coverage.run]
source = ["engine"]
branch = true

[tool.coverage.report]
skip_covered = false
precision = 1
