[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dls-correlation-tool"
version = "0.1.0"
description = "Motorsport telemetry correlation/box-plot/damper plotting toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "DLS Engineering" }]
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15.0.0", "fastparquet>=2024.11.0"]
pptx = ["python-pptx>=0.6.23"]
windows = ["pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
dls-correlation = "Run_Correlation:__main__"
dls-boxplots    = "Run_BoxPlots:__main__"
dls-dampers     = "Run_Dampers:__main__"

[tool.setuptools]
py-modules = ["bootstrap", "channel_config",
              "Run_Correlation", "Run_BoxPlots", "Run_Dampers", "Run_Template"]

[tool.setuptools.packages.find]
include = ["engine*", "tools*"]
