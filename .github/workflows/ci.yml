name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Prevent the auto-bootstrap venv re-exec inside CI runners; use the runner's
# Python + pinned requirements instead so builds are reproducible.
env:
  DLS_SKIP_BOOTSTRAP: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=7,<9"

      - name: Run tests
        run: pytest

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install "ruff>=0.6,<1.0"

      - name: Ruff check
        run: ruff check .
