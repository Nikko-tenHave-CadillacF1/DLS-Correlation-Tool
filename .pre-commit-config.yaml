# Pre-commit hooks for DLS-Correlation-Tool.
#
# Install once: `pip install pre-commit && pre-commit install`
# Run manually:  `pre-commit run --all-files`
#
# Ruff `format` runs alongside `check`. It is scoped by `pyproject.toml`
# (`[tool.ruff.format].exclude = ["Run_*.py"]`) so the user-editable
# Run_*.py configuration files at the repo root are NOT autoformatted —
# their visually-aligned columns and inline plot-definition layouts must
# stay stable for engineer readability.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
