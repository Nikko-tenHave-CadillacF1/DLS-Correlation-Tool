# Pre-commit hooks for DLS-Correlation-Tool.
#
# Install once: `pip install pre-commit && pre-commit install`
# Run manually:  `pre-commit run --all-files`
#
# Hooks are intentionally lightweight — no formatter/rewrite step is applied
# so the codebase's deliberately compressed style is preserved.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
